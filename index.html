<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projet Interactif - Fond Animé</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animation pour le zoom */
        #zoom-container {
            transition: transform 0.2s ease-out;
            transform-origin: top center;
        }

        /* --- NOUVEAU : Animation des bulles d'arrière-plan --- */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 7s infinite;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
        .animation-delay-4000 {
            animation-delay: 4s;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center pt-10 overflow-hidden relative selection:bg-pink-200">

<div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
    <div class="absolute top-0 left-1/4 w-72 h-72 bg-purple-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob"></div>
    <div class="absolute top-0 right-1/4 w-72 h-72 bg-yellow-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob animation-delay-2000"></div>
    <div class="absolute -bottom-8 left-1/3 w-72 h-72 bg-pink-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob animation-delay-4000"></div>
</div>

<div class="fixed top-4 right-4 bg-white/80 backdrop-blur-sm p-2 rounded-lg shadow-lg flex items-center gap-2 z-50 border border-white/50">
    <span class="text-xs font-bold text-gray-500 uppercase mr-1">Zoom</span>
    <button onclick="changeZoom(-0.1)" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-1 px-3 rounded text-sm">-</button>
    <span id="zoom-display" class="text-sm font-mono w-12 text-center">100%</span>
    <button onclick="changeZoom(0.1)" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-1 px-3 rounded text-sm">+</button>
    <button onclick="resetZoom()" class="text-xs text-blue-500 hover:underline ml-1">Reset</button>
</div>

<div id="zoom-container" class="w-full flex justify-center px-4 relative z-10">

    <div class="w-full max-w-xl">
        <div class="bg-white/60 backdrop-blur-md border border-white/40 p-6 sm:p-8 shadow-2xl rounded-2xl flex flex-col items-center gap-6">

            <img id="avatar-img"
                 src="./images/neutral.png"
                 alt="Avatar"
                 class="w-32 h-32 sm:w-48 sm:h-48 rounded-full object-cover shadow-lg border-4 border-white transition-all duration-300">

            <p id="output-message" class="text-lg sm:text-xl text-center text-gray-700 italic font-medium min-h-[3rem] px-2 drop-shadow-sm">
                Clique sur un bouton pour voir ma réaction...
            </p>

            <div class="flex flex-col sm:flex-row flex-wrap justify-center gap-4 w-full">
                <button id="btn-compliment" class="w-full sm:w-auto bg-green-500 text-white rounded-lg shadow-lg py-3 px-6 text-lg font-semibold hover:bg-green-600 hover:shadow-xl transition duration-300 transform hover:-translate-y-1">Compliment</button>
                <button id="btn-insulte" class="w-full sm:w-auto bg-red-500 text-white rounded-lg shadow-lg py-3 px-6 text-lg font-semibold hover:bg-red-600 hover:shadow-xl transition duration-300 transform hover:-translate-y-1">Insulte</button>
                <button id="btn-declaration" class="w-full sm:w-auto bg-pink-500 text-white rounded-lg shadow-lg py-3 px-6 text-lg font-semibold hover:bg-pink-600 hover:shadow-xl transition duration-300 transform hover:-translate-y-1">Déclaration</button>
            </div>

        </div>
    </div>
</div>

<script>
    // --- VARIABLES ---
    const image = document.getElementById('avatar-img');
    const message = document.getElementById('output-message');

    let etatValide = 'neutre';

    const sources = {
        neutre: "./images/neutral.png",
        compliment: { off: "./images/happy_off.png", on: "./images/happy_on.png" },
        insulte: { off: "./images/angry_off.png", on: "./images/angry_on.png" },
        declaration: { off: "./images/love_off.png", on: "./images/love_on.png" }
    };

    function restoreState() {
        if (etatValide === 'neutre') {
            image.src = sources.neutre;
        } else {
            image.src = sources[etatValide].on;
        }
    }

    // --- BOUTON COMPLIMENT ---
    const btnCompliment = document.getElementById('btn-compliment');
    btnCompliment.addEventListener('mouseenter', () => image.src = sources.compliment.off);
    btnCompliment.addEventListener('mouseleave', restoreState);
    btnCompliment.addEventListener('click', () => {
        etatValide = 'compliment';
        image.src = sources.compliment.on;
        message.textContent = "Oh merci, c'est gentil !";
        message.className = "text-lg sm:text-xl text-center text-green-600 font-bold min-h-[3rem] px-2 drop-shadow-sm";
    });

    // --- BOUTON INSULTE ---
    const btnInsulte = document.getElementById('btn-insulte');
    btnInsulte.addEventListener('mouseenter', () => image.src = sources.insulte.off);
    btnInsulte.addEventListener('mouseleave', restoreState);
    btnInsulte.addEventListener('click', () => {
        etatValide = 'insulte';
        image.src = sources.insulte.on;
        message.textContent = "Hé ! Pourquoi tant de haine ?";
        message.className = "text-lg sm:text-xl text-center text-red-600 font-bold min-h-[3rem] px-2 drop-shadow-sm";
    });

    // --- BOUTON DECLARATION ---
    const btnDeclaration = document.getElementById('btn-declaration');
    btnDeclaration.addEventListener('mouseenter', () => image.src = sources.declaration.off);
    btnDeclaration.addEventListener('mouseleave', restoreState);
    btnDeclaration.addEventListener('click', () => {
        etatValide = 'declaration';
        image.src = sources.declaration.on;
        message.textContent = "C'est vrai ? Je t'aime aussi ❤️";
        message.className = "text-lg sm:text-xl text-center text-pink-600 font-bold min-h-[3rem] px-2 drop-shadow-sm";
    });

    // --- LOGIQUE ZOOM ---
    let currentZoom = 1;
    const zoomContainer = document.getElementById('zoom-container');
    const zoomDisplay = document.getElementById('zoom-display');

    function changeZoom(amount) {
        currentZoom += amount;
        if (currentZoom < 0.5) currentZoom = 0.5;
        if (currentZoom > 2.0) currentZoom = 2.0;
        applyZoom();
    }
    function resetZoom() {
        currentZoom = 1;
        applyZoom();
    }
    function applyZoom() {
        zoomContainer.style.transform = `scale(${currentZoom})`;
        zoomDisplay.textContent = Math.round(currentZoom * 100) + "%";
    }
</script>
</body>
</html>
