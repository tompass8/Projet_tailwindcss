<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Projet interactif accessible avec des reactions visuelles et des messages dynamiques.">
    <title>The Emotional Guy</title>
    <link rel="preload" as="image" href="./images/neutral.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-gray-50 min-h-screen flex flex-col items-center pt-10 overflow-auto relative selection:bg-pink-200 text-gray-900">

<div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none" aria-hidden="true">
    <div class="absolute top-0 left-1/4 w-72 h-72 bg-purple-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob"></div>
    <div class="absolute top-0 right-1/4 w-72 h-72 bg-yellow-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob animation-delay-2000"></div>
    <div class="absolute -bottom-8 left-1/3 w-72 h-72 bg-pink-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob animation-delay-4000"></div>
</div>

<nav aria-label="Controle du zoom" class="fixed top-2 right-2 sm:top-4 sm:right-4 bg-white/95 backdrop-blur-md p-2 rounded-lg shadow-lg flex items-center gap-2 z-50 border border-gray-200/50 scale-90 sm:scale-100 origin-top-right">
    <span class="text-xs font-bold text-gray-700 uppercase mr-1 hidden sm:inline" id="zoom-label">Zoom</span>

    <button onclick="changeZoom(-0.1)" aria-label="Réduire le zoom" class="bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-1 px-3 rounded text-sm min-w-[30px]">-</button>

    <span id="zoom-display" aria-live="polite" class="text-sm font-mono w-10 text-center text-gray-800">100%</span>

    <button onclick="changeZoom(0.1)" aria-label="Augmenter le zoom" class="bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-1 px-3 rounded text-sm min-w-[30px]">+</button>
    <button onclick="resetZoom()" aria-label="Reinitialiser le zoom" class="text-xs text-blue-800 hover:underline ml-1 p-1">↺</button>
</nav>

<main id="zoom-container" class="w-full flex justify-center px-4 mb-32 relative z-10">

    <div class="w-full max-w-xl mt-8 sm:mt-0">
        <div class="bg-white/80 backdrop-blur-md border border-white/40 p-4 sm:p-8 shadow-2xl rounded-2xl flex flex-col items-center gap-6">

            <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 text-center">The Emotional Guy</h1>

            <img id="avatar-img"
                 src="./images/neutral.png"
                 alt="Personnage avec une expression neutre"
                  loading="eager"
                  fetchpriority="high"
                 decoding="async"
                 width="256"
                 height="256"
                 class="w-64 h-64 rounded-full object-cover shadow-lg border-4 border-white transition-all duration-300">

            <p id="output-message"
               aria-live="polite"
               class="text-2xl text-center text-gray-800 italic font-medium min-h-[4rem] flex items-center justify-center px-2 drop-shadow-sm">
                Clique sur un bouton pour voir ma réaction...
            </p>

            <div class="flex flex-col sm:flex-row flex-wrap justify-center gap-3 sm:gap-4 w-full">

                <button id="btn-compliment" class="btn-super-hover active:scale-95 w-full sm:w-auto bg-green-600 text-white rounded-lg shadow-lg py-3 px-6 text-lg font-semibold focus:ring-4 focus:ring-green-300">
                    Compliment
                </button>

                <button id="btn-insulte" class="btn-super-hover active:scale-95 w-full sm:w-auto bg-red-600 text-white rounded-lg shadow-lg py-3 px-6 text-lg font-semibold focus:ring-4 focus:ring-red-300">
                    Insulte
                </button>

                <button id="btn-declaration" class="btn-super-hover active:scale-95 w-full sm:w-auto bg-pink-600 text-white rounded-lg shadow-lg py-3 px-6 text-lg font-semibold focus:ring-4 focus:ring-pink-300">
                    Déclaration
                </button>

            </div>

        </div>
    </div>
</main>

<script src="script.js"></script>

</body>
</html>
